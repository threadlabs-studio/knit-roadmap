name: Feature request
description: Suggest an improvement or a new capability for Knit.
title: "[Feature]: "
labels:
  - "type:feature"
  - "status:needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Tell us about the problem first; a proposed solution is welcome but optional. This issue will be public, so do not include private workspace or account information.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the job or frustration in plain language.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a good outcome look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today?
      description: Optional. Describe workarounds or other tools you use.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed workspace content, private URLs, personal information, credentials, tokens, and raw logs.
          required: true
