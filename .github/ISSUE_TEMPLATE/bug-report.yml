name: Bug report
description: Tell us about reproducible behavior that is not working as expected.
title: "[Bug]: "
labels:
  - "type:bug"
  - "status:needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. This issue will be public. Remove workspace content, private URLs, email addresses, credentials, tokens, logs, and other identifying information.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Briefly describe the behavior you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use placeholder data and omit private workspace or account details.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does this happen?
      options:
        - Every time
        - Often
        - Sometimes
        - Once
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: For example, Safari on iPhone or Chrome on macOS. Do not include account identifiers.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed workspace content, private URLs, personal information, credentials, tokens, and raw logs.
          required: true
        - label: This is not a security vulnerability. Security reports belong in private vulnerability reporting.
          required: true
